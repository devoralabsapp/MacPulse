name: Feature request
description: Suggest an improvement to MacPulse.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: "Explain the user flow and any alternatives you have considered."
    validations:
      required: true
